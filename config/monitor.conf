cat << 'EOF' > ~/Monitor-servidor-atlas/config/monitor.conf
# ========================================================
# Configuracion de Umbrales y Parametros del Monitor Atlas
# =======================================================

# Umbrales de Almacenamiento (%)
DISCO_UMBRAL_CRITICO=85
DISCO_UMBRAL_WARN=70

# Servicios Criticos a Monitorear (Systemd)
SERVICIOS_A_VIGILAR=("sshs" "cron")

# Puertos TCP a MOnitorear
PUERTOS_A_VIGILAR=(22)

# Archivo de Salida para Logs
LOG_FILE="$HOME/monitor-servidor.atlas/logs/monitor.log"
EOF
